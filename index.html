<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Friends Weather | V5.2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; 
            --text-sub: #475569; --accent: #2563eb; --radius: 16px; --alert-red: #e11d48;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; 
            --text-sub: #94a3b8; --accent: #38bdf8; --alert-red: #fb7185;
        }
        body { font-size: 16px; font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-sub); margin: 0; padding: 10px; transition: 0.3s; }
        .container { max-width: 100%; margin: auto; padding: 15px; background: var(--card-bg); border-radius: var(--radius); text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }

        /* REFINED HEADER */
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.025em; margin: 0; }
        .logo-text span { color: var(--accent); font-weight: 400; }

        /* ALERT SYSTEM */
        #alert-banner {
            display: none; background: var(--alert-red); color: white;
            padding: 12px 15px; border-radius: 12px; margin-bottom: 15px;
            cursor: pointer; text-align: left; position: relative; font-size: 0.9rem;
        }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 15% auto; padding: 25px; width: 85%; max-width: 550px; border-radius: var(--radius); text-align: left; }
        
        /* RADAR & UI */
        #radar-container { position: relative; width: 100%; height: 350px; margin-top: 10px; border-radius: var(--radius); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        #radarMap { width: 100%; height: 100%; }
        .radar-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 12px 0 5px; padding: 10px; background: rgba(0,0,0,0.03); border-radius: 12px; }
        .play-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        #frame-time { font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 80px; }

        .radar-legend { margin: 5px 0 20px; padding: 10px; }
        .legend-bar { height: 8px; border-radius: 4px; margin-bottom: 6px; background: linear-gradient(to right, #01a000, #ffff00, #ff9000, #ff0000, #d00000, #ffffff); }
        .legend-labels { display: flex; justify-content: space-between; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; opacity: 0.7; }

        .search-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 14px; border: 2px solid rgba(0,0,0,0.1); border-radius: 12px; font-size: 1rem; background: var(--bg-color); color: var(--text-sub); }
        
        #forecast-display { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; }
        .forecast-card { background: rgba(0,0,0,0.02); padding: 12px; border-radius: 14px; min-width: 95px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.03); }
        
        .detail-row { padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.9rem; line-height: 1.5; }

        @media (min-width: 768px) { .container { max-width: 800px; padding: 35px; } .search-area { flex-direction: row; } #radar-container { height: 450px; } }
    </style>
</head>
<body>

<div class="container">
    <div id="alert-banner" onclick="openAlertModal()"></div>

    <div id="alertModal" class="modal">
        <div class="modal-content">
            <span style="float:right; cursor:pointer; font-size:1.5rem;" onclick="closeAlertModal()">&times;</span>
            <h2 id="modal-title" style="color:var(--alert-red); margin-top:0;">Weather Alert</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <header>
        <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌓</button>
        <h1 class="logo-text">bestfriends<span>weather</span><span class="paws">🐾</span></h1>
        <button onclick="smartHome()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🏠</button>
    </header>

    <div class="search-area">
        <input type="text" id="locationInput" placeholder="City or Zip Code">
        <button onclick="handleSearch()" style="background:var(--text-main); color:white; border:none; padding:14px; border-radius:12px; font-weight:600;">Update</button>
    </div>

    <div id="forecast-display"></div>

    <div id="radar-container"><div id="radarMap"></div></div>
    
    <div class="radar-controls">
        <button class="play-btn" id="playPauseBtn" onclick="toggleRadar()">Play Loop</button>
        <span id="frame-time">Ready</span>
    </div>

    <div class="radar-legend">
        <div class="legend-bar"></div>
        <div class="legend-labels"><span>Light</span><span>Moderate</span><span>Heavy</span><span>Extreme</span></div>
    </div>

    <div id="detailed-forecast" style="text-align:left;">
        <h3 style="font-size:1.1rem; color:var(--text-main);">7-Day Outlook</h3>
        <div id="detail-list"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, radarLayers = [], times = [], currentFrame = 0, loopInterval, isPlaying = false;

    function toggleTheme() {
        const d = document.documentElement;
        d.getAttribute('data-theme') === 'dark' ? d.removeAttribute('data-theme') : d.setAttribute('data-theme', 'dark');
    }

    function openAlertModal() { document.getElementById('alertModal').style.display = "block"; }
    function closeAlertModal() { document.getElementById('alertModal').style.display = "none"; }

    async function handleSearch() {
        const q = document.getElementById('locationInput').value;
        if(!q) return;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if(data[0]) fetchWeather(data[0].lat, data[0].lon, data[0].display_name.split(',')[0]);
    }

    function toggleRadar() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playPauseBtn');
        if (isPlaying) {
            btn.innerText = "Stop";
            runLoop();
        } else {
            btn.innerText = "Play Loop";
            clearInterval(loopInterval);
        }
    }

    function runLoop() {
        clearInterval(loopInterval);
        loopInterval = setInterval(() => {
            radarLayers.forEach(l => l.setOpacity(0));
            radarLayers[currentFrame].setOpacity(0.65);
            document.getElementById('frame-time').innerText = times[currentFrame];
            currentFrame = (currentFrame + 1) % radarLayers.length;
        }, 1000);
    }

    async function fetchWeather(lat, lon, name) {
        const alertBox = document.getElementById('alert-banner');
        alertBox.style.display = "none";
        if (map) map.remove();
        clearInterval(loopInterval);
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = "Play Loop";

        map = L.map('radarMap', { zoomControl: false, attributionControl: false }).setView([lat, lon], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        radarLayers = []; times = [];
        const now = new Date();
        for(let i=4; i>=0; i--) {
            let t = new Date(now.getTime() - (i * 15 * 60000));
            t.setMinutes(Math.floor(t.getMinutes() / 5) * 5); 
            let iso = t.toISOString().substring(0, 14) + t.toISOString().substring(14,15) + "0:00Z";
            times.push(t.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            let l = L.tileLayer.wms("https://nowcoast.noaa.gov/geoserver/observations/weather_radar/wms", {
                layers: 'conus_base_reflectivity_mosaic', format: 'image/png', transparent: true, opacity: 0, time: iso
            }).addTo(map);
            radarLayers.push(l);
        }
        
        currentFrame = radarLayers.length - 1;
        radarLayers[currentFrame].setOpacity(0.65);
        document.getElementById('frame-time').innerText = times[currentFrame];

        try {
            const pRes = await fetch(`https://api.weather.gov/points/${parseFloat(lat).toFixed(4)},${parseFloat(lon).toFixed(4)}`);
            const pData = await pRes.json();
            
            // Multi-Alert Check
            const zoneId = pData.properties.forecastZone.split('/').pop();
            const aRes = await fetch(`https://api.weather.gov/alerts/active/zone/${zoneId}`);
            const aData = await aRes.json();
            if(aData.features.length > 0) {
                const count = aData.features.length;
                const primary = aData.features[0].properties;
                alertBox.innerHTML = `⚠️ ${count > 1 ? 'Multiple Alerts Active' : primary.event}<br><small>${primary.headline || 'Tap for details'}</small>`;
                
                document.getElementById('modal-body').innerHTML = aData.features.map(f => `
                    <div style="margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
                        <h3 style="color:var(--alert-red); margin:0;">${f.properties.event}</h3>
                        <p style="white-space: pre-wrap; font-size:0.85rem;">${f.properties.description}</p>
                        <p style="font-weight:bold; font-size:0.8rem;">${f.properties.instruction || ''}</p>
                    </div>`).join('');
                alertBox.style.display = "block";
            }

            const fRes = await fetch(pData.properties.forecast);
            const fData = await fRes.json();
            const periods = fData.properties.periods;

            document.getElementById('forecast-display').innerHTML = periods.slice(0, 5).map(p => `
                <div class="forecast-card">
                    <div style="font-size:0.7rem; font-weight:700; opacity:0.8;">${p.name.toUpperCase()}</div>
                    <img src="${p.icon}" width="32" style="margin:8px 0;">
                    <div style="font-weight:800; font-size:1.1rem;">${p.temperature}°</div>
                </div>`).join('');

            document.getElementById('detail-list').innerHTML = periods.map(p => `
                <div class="detail-row"><strong>${p.name}</strong>: ${p.detailedForecast}</div>`).join('');
            
            document.getElementById('locationInput').value = name;
        } catch(e) { console.error("Data error"); }
    }

    window.onload = () => fetchWeather(37.2185, -80.2314, "Elliston, VA");
</script>
</body>
</html>
