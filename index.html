<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Friends Weather</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --text-primary: #003366;
            --text-secondary: #333;
            --accent: #00509d;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-primary: #4cc9f0;
            --text-secondary: #e0e0e0;
            --accent: #4361ee;
            --shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-secondary); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); text-align: center; }
        
        h1 { color: var(--text-primary); margin-bottom: 5px; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .theme-toggle { cursor: pointer; padding: 5px 10px; border-radius: 20px; border: 1px solid #ccc; background: transparent; color: var(--text-secondary); }

        .search-area { margin: 20px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        input { padding: 12px; width: 250px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; background: var(--card-bg); color: var(--text-secondary); }
        
        button { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-search { background: var(--text-primary); color: white; }
        .btn-fav { background: #ffcc00; color: #333; font-size: 1.2em; }
        button:hover { opacity: 0.8; }

        #favorites-bar { margin: 10px 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 30px; }
        .fav-chip { background: #d1e3ff; color: #003366; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        [data-theme="dark"] .fav-chip { background: #4361ee; color: white; }
        .remove-fav { color: #ff4d4d; font-weight: bold; margin-left: 5px; cursor: pointer; }

        #status { color: #666; font-style: italic; margin-bottom: 15px; }
        
        #forecast-display { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .forecast-card { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.1); padding: 15px; border-radius: 10px; width: 140px; }
        [data-theme="dark"] .forecast-card { background: rgba(255,255,255,0.05); }

        /* CLEAN RADAR MAP STYLES */
        #radarMap { width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 10px; margin-top: 20px; z-index: 1; }

        #detailed-forecast { margin-top: 30px; text-align: left; max-width: 800px; margin-left: auto; margin-right: auto; }
        .detail-row { padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); display: grid; grid-template-columns: 120px 1fr; gap: 15px; }
        [data-theme="dark"] .detail-row { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .detail-day { font-weight: bold; color: var(--text-primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Mode</button>
    </div>
    
    <h1>🐾 Best Friends Weather</h1>
    <div id="status">Waking up...</div>

    <div class="search-area">
        <input type="text" id="locationInput" placeholder="Zip or City, ST">
        <button class="btn-search" onclick="handleSearch()">Update</button>
        <button class="btn-fav" onclick="saveToFavorites()" title="Save to Favorites">★</button>
    </div>

    <div id="favorites-bar"></div>

    <div id="forecast-display"></div>

    <div id="radarMap"></div>

    <div id="detailed-forecast">
        <h3>Detailed 7-Day Outlook</h3>
        <div id="detail-list"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let currentDisplayName = "";
    let map, radarLayer;

    window.onload = function() {
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        renderFavorites();
        const last = localStorage.getItem('lastLocation');
        if (last) {
            getWeather(last);
        } else {
            tryAutoLocation();
        }
    };

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }

    async function tryAutoLocation() {
        document.getElementById('status').innerText = "Locating...";
        try {
            // Using a high-reliability IP lookup for instant location
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            if (data.city) {
                fetchWeatherByCoords(data.latitude, data.longitude, `${data.city}, ${data.region}`);
            } else { throw new Error(); }
        } catch {
            document.getElementById('status').innerText = "Please search for a location.";
        }
    }

    async function handleSearch() {
        const query = document.getElementById('locationInput').value;
        if (!query) return;
        getWeather(query);
    }

    async function getWeather(query) {
        document.getElementById('status').innerText = `Geocoding ${query}...`;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if (data.length === 0) throw new Error("Location not found.");
            
            const parts = data[0].display_name.split(',');
            currentDisplayName = parts[0] + (parts[1] ? ", " + parts[1] : "");
            localStorage.setItem('lastLocation', query);
            fetchWeatherByCoords(data[0].lat, data[0].lon, currentDisplayName);
        } catch (err) {
            document.getElementById('status').innerText = "Error: " + err.message;
        }
    }

    // THE LOGO-FREE RADAR FUNCTION
    function updateRadarMap(lat, lon) {
        if (map) { map.remove(); }
        
        map = L.map('radarMap').setView([lat, lon], 8);

        // Base Map Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OSM'
        }).addTo(map);

        // NWS nowCOAST Radar Overlay (Robust & Logo-Free)
        radarLayer = L.tileLayer.wms("https://nowcoast.noaa.gov/geoserver/observations/weather_radar/wms", {
            layers: 'conus_base_reflectivity_mosaic',
            format: 'image/png',
            transparent: true,
            opacity: 0.6,
            version: '1.3.0'
        }).addTo(map);
    }

    async function fetchWeatherByCoords(lat, lon, name = "Current Location") {
        const status = document.getElementById('status');
        const display = document.getElementById('forecast-display');
        const detailList = document.getElementById('detail-list');
        
        try {
            updateRadarMap(lat, lon);

            const pointRes = await fetch(`https://api.weather.gov/points/${parseFloat(lat).toFixed(4)},${parseFloat(lon).toFixed(4)}`);
            const pointData = await pointRes.json();
            
            const forecastRes = await fetch(pointData.properties.forecast);
            const forecastData = await forecastRes.json();

            display.innerHTML = "";
            detailList.innerHTML = "";

            // V4 Grid Cards
            forecastData.properties.periods.slice(0, 5).forEach(p => {
                display.innerHTML += `
                    <div class="forecast-card">
                        <strong>${p.name}</strong><br>
                        <img src="${p.icon}" alt="icon" width="40" style="margin:5px 0;"><br>
                        <span style="font-size:1.1em; font-weight:bold;">${p.temperature}°${p.temperatureUnit}</span><br>
                        <small style="font-size:0.8em; display:block; margin-top:5px;">${p.shortForecast}</small>
                    </div>`;
            });

            // V4 Detailed List
            forecastData.properties.periods.forEach(p => {
                detailList.innerHTML += `
                    <div class="detail-row">
                        <div class="detail-day">${p.name}</div>
                        <div class="detail-text">${p.detailedForecast}</div>
                    </div>`;
            });

            status.innerText = `Forecast for: ${name}`;
            document.getElementById('locationInput').value = name;
        } catch (err) {
            status.innerText = "Error loading NWS data.";
        }
    }

    // Favorites Logic from V4
    function saveToFavorites() {
        const query = document.getElementById('locationInput').value;
        if (!query || query.includes("Searching")) return;
        let favs = JSON.parse(localStorage.getItem('weatherFavs')) || [];
        if (!favs.includes(query)) {
            favs.push(query);
            localStorage.setItem('weatherFavs', JSON.stringify(favs));
            renderFavorites();
        }
    }

    function renderFavorites() {
        const bar = document.getElementById('favorites-bar');
        const favs = JSON.parse(localStorage.getItem('weatherFavs')) || [];
        bar.innerHTML = "";
        favs.forEach(fav => {
            const chip = document.createElement('div');
            chip.className = 'fav-chip';
            chip.innerHTML = `<span onclick="getWeather('${fav}')">${fav}</span> 
                              <span class="remove-fav" onclick="removeFavorite(event, '${fav}')">×</span>`;
            bar.appendChild(chip);
        });
    }

    function removeFavorite(event, fav) {
        event.stopPropagation();
        let favs = JSON.parse(localStorage.getItem('weatherFavs')) || [];
        favs = favs.filter(item => item !== fav);
        localStorage.setItem('weatherFavs', JSON.stringify(favs));
        renderFavorites();
    }
</script>

</body>
</html>
