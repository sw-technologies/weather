<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Best Friends Weather | V7.7</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; 
            --text-sub: #475569; --accent: #2563eb; --radius: 16px; --alert-red: #e11d48;
        }
        [data-theme="dark"] {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; 
            --text-sub: #94a3b8; --accent: #38bdf8; --alert-red: #fb7185;
        }
        body { font-size: 16px; font-family: 'Inter', -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-sub); margin: 0; padding: 10px; transition: 0.3s; }
        .container { max-width: 100%; margin: auto; padding: 15px; background: var(--card-bg); border-radius: var(--radius); text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; }
        .logo-text { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0; }
        .logo-text span { color: var(--accent); font-weight: 400; }
        #alert-banner { display: none; background: var(--alert-red); color: white; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; text-align: left; font-size: 0.9rem; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); overflow-y: auto; }
        .modal-content { background: var(--card-bg); margin: 15% auto; padding: 25px; width: 85%; max-width: 550px; border-radius: var(--radius); text-align: left; color: var(--text-main); }
        #radar-container { position: relative; width: 100%; height: 350px; margin-top: 10px; border-radius: var(--radius); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); }
        #radarMap { width: 100%; height: 100%; background: #aacbff; }
        
        .mode-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .mode-btn { background: rgba(0,0,0,0.05); border: none; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--text-sub); }
        .mode-btn.active { background: var(--accent); color: white; }

        .radar-controls { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 5px 0; padding: 10px; background: rgba(0,0,0,0.03); border-radius: 12px; }
        .play-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        #frame-time { font-size: 0.85rem; font-weight: 700; color: var(--accent); min-width: 80px; }
        .radar-legend { margin: 5px 0 20px; padding: 10px; }
        .legend-bar { height: 8px; border-radius: 4px; margin-bottom: 6px; }
        .refl-gradient { background: linear-gradient(to right, #01a000, #ffff00, #ff9000, #ff0000, #d00000); }
        .rain-gradient { background: linear-gradient(to right, #ffffff, #00ffff, #0000ff, #ffff00, #ff0000); }
        .legend-labels { display: flex; justify-content: space-between; font-size: 0.65rem; text-transform: uppercase; font-weight: 700; opacity: 0.7; }
        .search-area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 14px; border: 2px solid rgba(0,0,0,0.1); border-radius: 12px; font-size: 1rem; background: var(--bg-color); color: var(--text-main); }
        #forecast-display { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none; }
        .forecast-card { background: rgba(0,0,0,0.02); padding: 12px; border-radius: 14px; min-width: 100px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .detail-row { padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.9rem; text-align: left; }
        @media (min-width: 768px) { .container { max-width: 800px; } .search-area { flex-direction: row; } #radar-container { height: 450px; } }
    </style>
</head>
<body>

<div class="container">
    <div id="alert-banner" onclick="openModal('alertModal')"></div>
    <div id="alertModal" class="modal"><div class="modal-content"><span style="float:right; cursor:pointer;" onclick="closeModal('alertModal')">&times;</span><h2 style="color:var(--alert-red)">Active Alerts</h2><div id="modal-body"></div></div></div>

    <header>
        <button onclick="toggleTheme()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🌓</button>
        <h1 class="logo-text">bestfriends<span>weather</span>🐾</h1>
        <button onclick="smartHome()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">🏠</button>
    </header>

    <div class="search-area">
        <input type="text" id="locationInput" placeholder="City or Zip">
        <button onclick="handleSearch()" style="background:var(--text-main); color:white; border:none; padding:14px; border-radius:12px; font-weight:600; cursor:pointer;">Update</button>
    </div>

    <div id="forecast-display"></div>

    <div class="mode-selector">
        <button id="reflBtn" class="mode-btn active" onclick="setRadarMode('reflectivity')">Radar</button>
        <button id="rainBtn" class="mode-btn" onclick="setRadarMode('rain')">1-Hr Rain</button>
    </div>

    <div id="radar-container"><div id="radarMap"></div></div>
    
    <div id="controlPanel" class="radar-controls">
        <button class="play-btn" id="playPauseBtn" onclick="toggleRadar()">Play Loop</button>
        <span id="frame-time">Ready</span>
    </div>

    <div class="radar-legend">
        <div id="legendBar" class="legend-bar refl-gradient"></div>
        <div id="legendLabels" class="legend-labels"><span>Light</span><span>Moderate</span><span>Heavy</span><span>Extreme</span></div>
    </div>

    <div id="detail-list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, radarLayers = [], times = [], currentFrame = 0, loopInterval, isPlaying = false, radarMode = 'reflectivity';
    const HOME = { lat: 37.2185, lon: -80.2314, name: "Elliston, VA" };

    function toggleTheme() {
        const d = document.documentElement;
        d.getAttribute('data-theme') === 'dark' ? d.removeAttribute('data-theme') : d.setAttribute('data-theme', 'dark');
    }

    function smartHome() { fetchWeather(HOME.lat, HOME.lon, HOME.name); }
    function openModal(id) { document.getElementById(id).style.display = "block"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    function setRadarMode(mode) {
        radarMode = mode;
        document.getElementById('reflBtn').classList.toggle('active', mode === 'reflectivity');
        document.getElementById('rainBtn').classList.toggle('active', mode === 'rain');
        
        const bar = document.getElementById('legendBar');
        const labels = document.getElementById('legendLabels');
        const controls = document.getElementById('controlPanel');

        if (mode === 'rain') {
            bar.className = 'legend-bar rain-gradient';
            labels.innerHTML = '<span>0.01"</span><span>0.10"</span><span>0.50"</span><span>1.0"+</span>';
            controls.style.display = 'none'; 
            if(isPlaying) toggleRadar();
        } else {
            bar.className = 'legend-bar refl-gradient';
            labels.innerHTML = '<span>Light</span><span>Moderate</span><span>Heavy</span><span>Extreme</span>';
            controls.style.display = 'flex';
        }
        setupRadar(map.getCenter().lat, map.getCenter().lng);
    }

    async function handleSearch() {
        const q = document.getElementById('locationInput').value;
        if(!q) return;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&limit=1&q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if(data[0]) fetchWeather(data[0].lat, data[0].lon, data[0].display_name.split(',')[0]);
    }

    async function fetchWeather(lat, lon, name) {
        if (map) map.remove();
        clearInterval(loopInterval);
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = "Play Loop";
        map = L.map('radarMap', { zoomControl: false, attributionControl: false }).setView([lat, lon], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        try {
            const pRes = await fetch(`https://api.weather.gov/points/${parseFloat(lat).toFixed(4)},${parseFloat(lon).toFixed(4)}`);
            const pData = await pRes.json();
            const fRes = await fetch(pData.properties.forecast);
            const fData = await fRes.json();
            const periods = fData.properties.periods;

            document.getElementById('forecast-display').innerHTML = periods.slice(0, 6).map(p => `
                <div class="forecast-card">
                    <span style="font-size:0.7rem; font-weight:700;">${p.name.toUpperCase()}</span>
                    <img src="${p.icon}" width="32" style="margin:8px 0; border-radius:50%">
                    <span style="font-size:1.1rem; font-weight:800;">${p.temperature}°</span>
                </div>`).join('');

            document.getElementById('detail-list').innerHTML = periods.map(p => `<div class="detail-row"><strong>${p.name}:</strong> ${p.detailedForecast}</div>`).join('');
            document.getElementById('locationInput').value = name;
            setupRadar(lat, lon);
        } catch(e) { console.error(e); }
    }

    function setupRadar(lat, lon) {
        radarLayers.forEach(l => map.removeLayer(l));
        radarLayers = []; times = [];
        
        if (radarMode === 'reflectivity') {
            const baseTime = new Date();
            baseTime.setMinutes(Math.floor(baseTime.getMinutes() / 15) * 15);
            for(let i=4; i>=0; i--) {
                let t = new Date(baseTime.getTime() - (i * 15 * 60000));
                let iso = t.toISOString().substring(0, 16) + ":00Z";
                times.push(t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
                let l = L.tileLayer.wms("https://nowcoast.noaa.gov/geoserver/observations/weather_radar/wms", {
                    layers: 'conus_base_reflectivity_mosaic', format: 'image/png', transparent: true, opacity: 0, time: iso
                }).addTo(map);
                radarLayers.push(l);
            }
            currentFrame = radarLayers.length - 1;
            radarLayers[currentFrame].setOpacity(0.65);
            document.getElementById('frame-time').innerText = times[currentFrame];
        } else {
            // Rolling 1-Hour Precipitation Accumulation (QPE)
            let l = L.tileLayer.wms("https://nowcoast.noaa.gov/geoserver/observations/weather_radar/wms", {
                layers: 'conus_qpe_01h_rolling',
                format: 'image/png', transparent: true, opacity: 0.7
            }).addTo(map);
            radarLayers.push(l);
            document.getElementById('frame-time').innerText = "1-Hr Total";
        }
    }

    function toggleRadar() {
        if (radarMode !== 'reflectivity') return;
        isPlaying = !isPlaying;
        const btn = document.getElementById('playPauseBtn');
        if(isPlaying) {
            btn.innerText = "Stop";
            loopInterval = setInterval(() => {
                radarLayers.forEach(l => l.setOpacity(0));
                currentFrame = (currentFrame + 1) % radarLayers.length;
                radarLayers[currentFrame].setOpacity(0.65);
                document.getElementById('frame-time').innerText = times[currentFrame];
            }, 1000);
        } else {
            btn.innerText = "Play Loop";
            clearInterval(loopInterval);
        }
    }

    window.onload = () => smartHome();
</script>
</body>
</html>
